<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tugas 2 - Data Pegawai</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h1 { text-align: center; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid black; padding: 8px; }
    thead { background-color: #2c3e50; color: white; }
    tfoot { background-color: #ecf0f1; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Data Pegawai</h1>

  <table>
    <thead>
      <tr>
        <th>Nama Pegawai</th>
        <th>Umur</th>
        <th>Jabatan</th>
        <th>Status</th>
        <th>Gaji Pokok</th>
        <th>Tunjangan Jabatan</th>
        <th>BPJS</th>
        <th>Tunjangan Keluarga</th>
      </tr>
    </thead>
    <tbody id="isiTabel"></tbody>
    <tfoot id="footTabel"></tfoot>
  </table>

  <script>
    // data pegawainya
    var nama = "Dodi Prayodi";
    var umur = 25;
    var jabatan = "Manajer";
    var status = "Menikah";

    // cari gaji pokok, tergantung jabatannya
    var gapok = 0;
    if (jabatan == "Manajer") {
      gapok = 15000000;
    } else if (jabatan == "Asisten Manajer") {
      gapok = 10000000;
    } else if (jabatan == "Staf") {
      gapok = 5000000;
    }

    // hitung tunjangan-tunjangannya
    var tunjanganJabatan = gapok * 15 / 100;   // 15% dari gapok
    var bpjs = gapok * 10 / 100;               // 10% dari gapok

    // pakai ternary: kalau menikah dapat 20% dari gapok, kalau nggak ya 0
    var tunjanganKeluarga = status == "Menikah" ? gapok * 20 / 100 : 0;

    // jumlahin semuanya jadi total gaji
    var totalGaji = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

    // fungsi biar angkanya tampil rapi, contoh: Rp 15.000.000
    function rupiah(angka) {
      return "Rp " + angka.toLocaleString("id-ID");
    }

    // tampilin data ke tbody
    document.getElementById("isiTabel").innerHTML =
      "<tr>" +
        "<td>" + nama + "</td>" +
        "<td>" + umur + " tahun</td>" +
        "<td>" + jabatan + "</td>" +
        "<td>" + status + "</td>" +
        "<td>" + rupiah(gapok) + "</td>" +
        "<td>" + rupiah(tunjanganJabatan) + "</td>" +
        "<td>" + rupiah(bpjs) + "</td>" +
        "<td>" + rupiah(tunjanganKeluarga) + "</td>" +
      "</tr>";

    // tampilin total gaji ke tfoot
    document.getElementById("footTabel").innerHTML =
      "<tr>" +
        "<td colspan='7'>Total Gaji</td>" +
        "<td>" + rupiah(totalGaji) + "</td>" +
      "</tr>";
  </script>
</body>
</html>
